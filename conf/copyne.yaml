# network architecture
# encoder related
encoder: zipformer_ctc
encoder_conf:
    output_size: 256    # dimension of attention
    encoder_dims: [256, 256]
    attention_dim: [192, 192]
    encoder_unmasked_dims: [192, 192]
    zipformer_downsampling_factors: [1, 2]
    nhead: [4, 4]
    feedforward_dim: [1024, 1024]
    num_encoder_layers: [2, 2]
    dropout: 0.1
    cnn_module_kernels: [31, 31]

# decoder related
decoder: conattransformer
decoder_conf:
    attention_heads: 4
    linear_units: 2048
    num_blocks: 6
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    self_attention_dropout_rate: 0.0
    src_attention_dropout_rate: 0.0
    contextual_att: true
    cocoder_out_dim: 512

# hybrid CTC/attention
model_conf:
    ctc_weight: 0.3
    lsm_weight: 0.1     # label smoothing option
    length_normalized_loss: false
    add_context_att: true
    add_null_context: true
    concoder_cofig:
        type: lstm
        lstm:
            input_size: 256
            hidden_size: 512
            num_layers: 3
            dropout: 0.1
            pad_idx: -1
            bidirectional: false
        transformer:
            input_size: 256
            num_layers: 2
            dropout: 0.2
            pad_idx: -1

dataset_conf:
    filter_conf:
        max_length: 40960
        min_length: 0
        token_max_length: 200
        token_min_length: 1
    resample_conf:
        resample_rate: 16000
    speed_perturb: true
    fbank_conf:
        num_mel_bins: 80
        frame_shift: 10
        frame_length: 25
        dither: 0.1
    spec_aug: true
    spec_aug_conf:
        num_t_mask: 2
        num_f_mask: 2
        max_t: 50
        max_f: 10
    shuffle: true
    shuffle_conf:
        shuffle_size: 1500
    sort: true
    sort_conf:
        sort_size: 500  # sort_size should be less than shuffle_size
    batch_conf:
        batch_type: 'static' # static or dynamic
        batch_size: 16

grad_clip: 5
accum_grad: 1
max_epoch: 150
log_interval: 100
keep_nbest_models: 10

optim: scaled_adam
optim_conf:
    lr: 0.0015
    clipping_scale: 2.0
scheduler: warmuplr     # pytorch v1.1.0+ required
scheduler_conf:
    warmup_steps: 10000
